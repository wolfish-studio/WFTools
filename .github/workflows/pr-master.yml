name: Pull Request to Master

on:
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: 'preview'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Executar Testes
        run: dotnet test Wolfish.Tests/Wolfish.Tests.csproj -c Release --no-build --verbosity normal
